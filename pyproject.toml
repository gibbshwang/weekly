[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weekly-skill-bundle"
version = "0.1.0"
description = "Weekly Report Automation Harness skill bundle"
requires-python = ">=3.10"
dependencies = [
  "openpyxl>=3.1",
  "Jinja2>=3.1",
  "PyYAML>=6.0",
  "pydantic>=2.6",
  "click>=8.1",
  "keyring>=25.0",
  "requests>=2.31",
]
# NOTE: No AI SDK deps (anthropic / openai / google-generativeai). Per security
# policy, AI calls go through Codex CLI / Gemini CLI subprocess only. The
# bundle scripts (lib/llm_call.py) shell out to those binaries.

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-mock>=3.12"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
